enterprise:
  available: true
  contact: https://bird.com/demo
  note: Above 2.5M emails a month, Bird directs to Enterprise. No published rate.
usage_pricing:
  - channel: sms
    model: per-message, per-destination-country and sender type
    source: https://bird.com/pricing/sms.md
    example_rates:
      - {destination: United States, note: see source grid}
      - {destination: Australia, alphanumeric: '0.0325'}
      - {destination: Brazil, alphanumeric: '0.0325'}
      - {destination: United Kingdom, note: see source grid}
    note: 200+ destinations with separate alphanumeric / long code / toll-free / short code columns.
  - channel: whatsapp
    model: per-message by conversation category
    source: https://bird.com/pricing/whatsapp.md
    rates:
      - {category: Marketing, initiation: business, price: '0.030'}
      - {category: Utility, initiation: business, price: '0.0084'}
      - {category: Authentication, initiation: business, price: '0.0084'}
      - {category: Service, initiation: user, price: '0.0084'}
    note: Bird's send fee plus the applicable Meta share. Meta does not charge service messages or utility templates inside the 24-hour customer service window.
  - channel: voice
    model: per-minute plus monthly number rental
    source: https://bird.com/pricing/voice.md
    rates:
      - {item: Outbound landline (from US), price: '0.0049', unit: minute}
      - {item: Outbound toll-free (from US), price: '0.0049', unit: minute}
      - {item: Inbound local number rental (US), price: '1.00', unit: month}
      - {item: Inbound toll-free number rental (US), price: '2.00', unit: month}
      - {item: Received, local/national (US), price: '0.0090', unit: minute}
      - {item: Received, toll-free (US), price: '0.018', unit: minute}
      - {item: Call handling fee, price: '0.0040', unit: minute, note: billed per second, on top of every call}
  - channel: lookup
    model: per-request, base plus per-property
    source: https://bird.com/products/lookup/pricing.md
    rates:
      - {item: Base phone lookup, price: '0.0050'}
      - {item: Classification property, price: '0.0080'}
      - {item: Porting property, price: '0.0070'}
      - {item: Presence property, price: '0.0070'}
      - {item: Roaming property, price: '0.010'}
      - {item: Score property, price: '0.025'}
      - {item: Email lookup, price: '0.00050', note: per verdict; every verdict bills, undeliverable included}
