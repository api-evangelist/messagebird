note: >-
  Replaces the 2026-05-04 generated sweep, which carried unsourced per-channel rates. Every
  figure below was read from Bird's own pricing pages on 2026-09-17; each page also publishes
  a Markdown twin (append .md), and bird.com/pricing.md is itself an index of every page that
  publishes a rate. Email is the only channel with named subscription tiers; every other
  channel is pure usage pricing, and the SMS per-country grid (200+ destinations) is not
  reproduced here — see the source page.
description: >-
  Bird prices by volume, not by seat. Email carries named monthly tiers with a volume
  allowance; every other product bills per message, per minute or per request at a published
  rate, with no platform fee and no per-seat fee.
currency: USD
tags:
  - Communications
  - Email
  - SMS
  - WhatsApp
  - Voice
  - Lookup
