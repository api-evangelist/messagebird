  the repo at runtime, which are not mirrored.
plugin:
  marketplace: messagebird/bird-ai
  repository: https://github.com/messagebird/bird-ai
  version: 0.50.1
  spec: https://agent-plugins.org/specification
  install:
    claude_code:
      - claude plugin marketplace add messagebird/bird-ai
      - claude plugin install bird@bird-ai
    codex:
      - codex plugin marketplace add messagebird/bird-ai
      - codex plugin add bird@bird-ai
    copilot:
      - copilot plugin marketplace add messagebird/bird-ai
      - copilot plugin install bird@bird-ai
    cursor: Settings > Plugins, add the marketplace and install the bird plugin
    factory_droid: Clone the repo and copy plugins/bird/skills/ into .factory/skills/ by hand
skills:
