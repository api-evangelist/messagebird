searched_notes:
  - 'Bird platform API: bearer credential in the Authorization header. Two token families — API keys prefixed bk_{region}_
    and OAuth access tokens prefixed bt_{region}_; the prefix names the region and therefore the host to call (us1.platform.bird.com
    / eu1.platform.bird.com).'
  - 'Bird is an OAuth 2.0 authorization server issuing at https://platform.bird.com. Grants: authorization_code
    with PKCE S256, device_code, refresh_token (rotating). No client_credentials and no assertion grant — an agent
    always acts for a consenting user.'
  - RFC 7591 dynamic client registration is open at https://platform.bird.com/v1/oauth/register; a registered client
    is public and its client_name is self-asserted.
  - 'A 401 names its own discovery document: WWW-Authenticate: Bearer resource_metadata="https://platform.bird.com/.well-known/oauth-protected-resource".'
  - 44 scopes, resource:level pairs, enumerated in scopes/messagebird-scopes.yml. Consent caps an over-broad request
    down to what the user holds rather than refusing it.
  - Realtime uses a separate app key/secret pair (X-Realtime-Key / X-Realtime-Secret) alongside the workspace credential.
  - 'The legacy MessageBird REST API (rest.messagebird.com) is unrelated: Authorization: AccessKey {accessKey},
    no OAuth, no scopes.'
