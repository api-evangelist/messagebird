source: https://bird.com/docs/sdks.md plus registry metadata endpoints (registry.npmjs.org, pypi.org, proxy.golang.org, repo.packagist.org, rubygems.org, api.nuget.org, search.maven.org) queried 2026-09-17
note: >-
  MessageBird trades as Bird. Two generations of client libraries coexist and the
  distinction is load-bearing: the "bird-sdk-*" family is generated from the current
  https://bird.com/openapi.json and all four released on 2026-09-17, while the older
  "*-rest-api" family wraps the legacy rest.messagebird.com API and has not shipped in
  1-3 years. Both are first-party (github.com/messagebird), so both are official:true;
  the `generation` field says which contract each one speaks.
