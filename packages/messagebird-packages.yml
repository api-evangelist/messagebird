  note: >-
    The CLI is distributed as a signed tarball from cli.bird.com, not from a package
    registry, so there is no metadata endpoint to date it. The version is read from the
    first-party Homebrew formula (messagebird/homebrew-tap Formula/bird.rb, version 0.83.0,
    pinning https://cli.bird.com/releases/v0.83.0/). The bare install script
    (curl https://cli.bird.com/install.sh | sh) is UNPINNED and floats to latest, so a
    consumer using it cannot tell which build they received either.
