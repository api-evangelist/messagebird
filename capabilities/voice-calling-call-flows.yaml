    description: MessageBird Voice Calling API — Call Flows business capability. Self-contained, no shared references.
    resources:
    - name: call-flows
      path: /call-flows
      operations:
      - name: listcallflows
        method: GET
        description: List all call flows
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcallflow
        method: POST
        description: Create a call flow
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: call-flows-callFlowId
      path: /call-flows/{callFlowId}
      operations:
      - name: viewcallflow
        method: GET
        description: View a call flow
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatecallflow
        method: PUT
        description: Update a call flow
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
