naftiko: 1.0.0-alpha2
info:
  label: MessageBird Conversations API — Messages
  description: 'MessageBird Conversations API — Messages. 4 operations. Lead operation: List messages in a conversation. Self-contained
    Naftiko capability covering one Messagebird business surface.'
  tags:
  - Messagebird
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MESSAGEBIRD_API_KEY: MESSAGEBIRD_API_KEY
capability:
  consumes:
  - type: http
    namespace: conversations-messages
    baseUri: https://conversations.messagebird.com/v1
    description: MessageBird Conversations API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: conversations-conversationId-messages
      path: /conversations/{conversationId}/messages
      operations:
      - name: listconversationmessages
        method: GET
        description: List messages in a conversation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: sendconversationmessage
        method: POST
        description: Send a message in a conversation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: messages-messageId
      path: /messages/{messageId}
      operations:
      - name: viewmessage
        method: GET
        description: View a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: send
      path: /send
      operations:
      - name: sendmessage
        method: POST
        description: Send a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MESSAGEBIRD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: conversations-messages-rest
    port: 8080
    description: REST adapter for MessageBird Conversations API — Messages. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/conversations/{conversationid}/messages
      name: conversations-conversationid-messages
      description: REST surface for conversations-conversationId-messages.
      operations:
      - method: GET
        name: listconversationmessages
        description: List messages in a conversation
        call: conversations-messages.listconversationmessages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: sendconversationmessage
        description: Send a message in a conversation
        call: conversations-messages.sendconversationmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{messageid}
      name: messages-messageid
      description: REST surface for messages-messageId.
      operations:
      - method: GET
        name: viewmessage
        description: View a message
        call: conversations-messages.viewmessage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/send
      name: send
      description: REST surface for send.
      operations:
      - method: POST
        name: sendmessage
        description: Send a message
        call: conversations-messages.sendmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: conversations-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for MessageBird Conversations API — Messages. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-messages-conversation
      description: List messages in a conversation
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: conversations-messages.listconversationmessages
      outputParameters:
      - type: object
        mapping: $.
    - name: send-message-conversation
      description: Send a message in a conversation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: conversations-messages.sendconversationmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: view-message
      description: View a message
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: conversations-messages.viewmessage
      outputParameters:
      - type: object
        mapping: $.
    - name: send-message
      description: Send a message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: conversations-messages.sendmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
