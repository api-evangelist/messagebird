naftiko: 1.0.0-alpha2
info:
  label: MessageBird Voice Calling API — Calls
  description: 'MessageBird Voice Calling API — Calls. 4 operations. Lead operation: List all calls. Self-contained Naftiko
    capability covering one Messagebird business surface.'
  tags:
  - Messagebird
  - Calls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MESSAGEBIRD_API_KEY: MESSAGEBIRD_API_KEY
capability:
  consumes:
  - type: http
    namespace: voice-calling-calls
    baseUri: https://voice.messagebird.com
    description: MessageBird Voice Calling API — Calls business capability. Self-contained, no shared references.
    resources:
    - name: calls
      path: /calls
      operations:
      - name: listcalls
        method: GET
        description: List all calls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcall
        method: POST
        description: Create a call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: calls-callId
      path: /calls/{callId}
      operations:
      - name: viewcall
        method: GET
        description: View a call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletecall
        method: DELETE
        description: Delete a call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MESSAGEBIRD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: voice-calling-calls-rest
    port: 8080
    description: REST adapter for MessageBird Voice Calling API — Calls. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/calls
      name: calls
      description: REST surface for calls.
      operations:
      - method: GET
        name: listcalls
        description: List all calls
        call: voice-calling-calls.listcalls
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcall
        description: Create a call
        call: voice-calling-calls.createcall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/calls/{callid}
      name: calls-callid
      description: REST surface for calls-callId.
      operations:
      - method: GET
        name: viewcall
        description: View a call
        call: voice-calling-calls.viewcall
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletecall
        description: Delete a call
        call: voice-calling-calls.deletecall
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: voice-calling-calls-mcp
    port: 9090
    transport: http
    description: MCP adapter for MessageBird Voice Calling API — Calls. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-all-calls
      description: List all calls
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: voice-calling-calls.listcalls
      outputParameters:
      - type: object
        mapping: $.
    - name: create-call
      description: Create a call
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: voice-calling-calls.createcall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: view-call
      description: View a call
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: voice-calling-calls.viewcall
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-call
      description: Delete a call
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: voice-calling-calls.deletecall
      outputParameters:
      - type: object
        mapping: $.
