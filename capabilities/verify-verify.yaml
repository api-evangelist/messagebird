naftiko: 1.0.0-alpha2
info:
  label: MessageBird Verify API — Verify
  description: 'MessageBird Verify API — Verify. 4 operations. Lead operation: Create a verification. Self-contained Naftiko
    capability covering one Messagebird business surface.'
  tags:
  - Messagebird
  - Verify
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MESSAGEBIRD_API_KEY: MESSAGEBIRD_API_KEY
capability:
  consumes:
  - type: http
    namespace: verify-verify
    baseUri: https://rest.messagebird.com
    description: MessageBird Verify API — Verify business capability. Self-contained, no shared references.
    resources:
    - name: verify
      path: /verify
      operations:
      - name: createverify
        method: POST
        description: Create a verification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: verify-id
      path: /verify/{id}
      operations:
      - name: viewverify
        method: GET
        description: View a verification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteverify
        method: DELETE
        description: Delete a verification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: verify-id-verify
      path: /verify/{id}/verify
      operations:
      - name: verifytoken
        method: GET
        description: Verify a token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: query
          type: string
          description: The verification token to validate.
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MESSAGEBIRD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: verify-verify-rest
    port: 8080
    description: REST adapter for MessageBird Verify API — Verify. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/verify
      name: verify
      description: REST surface for verify.
      operations:
      - method: POST
        name: createverify
        description: Create a verification
        call: verify-verify.createverify
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/verify/{id}
      name: verify-id
      description: REST surface for verify-id.
      operations:
      - method: GET
        name: viewverify
        description: View a verification
        call: verify-verify.viewverify
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteverify
        description: Delete a verification
        call: verify-verify.deleteverify
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/verify/{id}/verify
      name: verify-id-verify
      description: REST surface for verify-id-verify.
      operations:
      - method: GET
        name: verifytoken
        description: Verify a token
        call: verify-verify.verifytoken
        with:
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: verify-verify-mcp
    port: 9090
    transport: http
    description: MCP adapter for MessageBird Verify API — Verify. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-verification
      description: Create a verification
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: verify-verify.createverify
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: view-verification
      description: View a verification
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: verify-verify.viewverify
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-verification
      description: Delete a verification
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: verify-verify.deleteverify
      outputParameters:
      - type: object
        mapping: $.
    - name: verify-token
      description: Verify a token
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: verify-verify.verifytoken
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
