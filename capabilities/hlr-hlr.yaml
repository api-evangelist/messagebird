naftiko: 1.0.0-alpha2
info:
  label: MessageBird HLR API — HLR
  description: 'MessageBird HLR API — HLR. 2 operations. Lead operation: Create an HLR. Self-contained Naftiko capability
    covering one Messagebird business surface.'
  tags:
  - Messagebird
  - HLR
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MESSAGEBIRD_API_KEY: MESSAGEBIRD_API_KEY
capability:
  consumes:
  - type: http
    namespace: hlr-hlr
    baseUri: https://rest.messagebird.com
    description: MessageBird HLR API — HLR business capability. Self-contained, no shared references.
    resources:
    - name: hlr
      path: /hlr
      operations:
      - name: createhlr
        method: POST
        description: Create an HLR
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: hlr-id
      path: /hlr/{id}
      operations:
      - name: viewhlr
        method: GET
        description: View an HLR
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MESSAGEBIRD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: hlr-hlr-rest
    port: 8080
    description: REST adapter for MessageBird HLR API — HLR. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/hlr
      name: hlr
      description: REST surface for hlr.
      operations:
      - method: POST
        name: createhlr
        description: Create an HLR
        call: hlr-hlr.createhlr
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/hlr/{id}
      name: hlr-id
      description: REST surface for hlr-id.
      operations:
      - method: GET
        name: viewhlr
        description: View an HLR
        call: hlr-hlr.viewhlr
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hlr-hlr-mcp
    port: 9090
    transport: http
    description: MCP adapter for MessageBird HLR API — HLR. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-hlr
      description: Create an HLR
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: hlr-hlr.createhlr
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: view-hlr
      description: View an HLR
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hlr-hlr.viewhlr
      outputParameters:
      - type: object
        mapping: $.
