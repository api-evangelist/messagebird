naftiko: 1.0.0-alpha2
info:
  label: MessageBird SMS Messaging API — Messages
  description: 'MessageBird SMS Messaging API — Messages. 4 operations. Lead operation: List messages. Self-contained Naftiko
    capability covering one Messagebird business surface.'
  tags:
  - Messagebird
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MESSAGEBIRD_API_KEY: MESSAGEBIRD_API_KEY
capability:
  consumes:
  - type: http
    namespace: sms-messaging-messages
    baseUri: https://rest.messagebird.com
    description: MessageBird SMS Messaging API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: messages
      path: /messages
      operations:
      - name: listmessages
        method: GET
        description: List messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createmessage
        method: POST
        description: Send a new message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: messages-id
      path: /messages/{id}
      operations:
      - name: viewmessage
        method: GET
        description: View a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletemessage
        method: DELETE
        description: Delete a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MESSAGEBIRD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: sms-messaging-messages-rest
    port: 8080
    description: REST adapter for MessageBird SMS Messaging API — Messages. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/messages
      name: messages
      description: REST surface for messages.
      operations:
      - method: GET
        name: listmessages
        description: List messages
        call: sms-messaging-messages.listmessages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createmessage
        description: Send a new message
        call: sms-messaging-messages.createmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages/{id}
      name: messages-id
      description: REST surface for messages-id.
      operations:
      - method: GET
        name: viewmessage
        description: View a message
        call: sms-messaging-messages.viewmessage
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletemessage
        description: Delete a message
        call: sms-messaging-messages.deletemessage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sms-messaging-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for MessageBird SMS Messaging API — Messages. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-messages
      description: List messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sms-messaging-messages.listmessages
      outputParameters:
      - type: object
        mapping: $.
    - name: send-new-message
      description: Send a new message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sms-messaging-messages.createmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: view-message
      description: View a message
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sms-messaging-messages.viewmessage
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-message
      description: Delete a message
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: sms-messaging-messages.deletemessage
      outputParameters:
      - type: object
        mapping: $.
