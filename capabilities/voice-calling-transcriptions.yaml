naftiko: 1.0.0-alpha2
info:
  label: MessageBird Voice Calling API — Transcriptions
  description: 'MessageBird Voice Calling API — Transcriptions. 2 operations. Lead operation: List transcriptions for a recording.
    Self-contained Naftiko capability covering one Messagebird business surface.'
  tags:
  - Messagebird
  - Transcriptions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MESSAGEBIRD_API_KEY: MESSAGEBIRD_API_KEY
capability:
  consumes:
  - type: http
    namespace: voice-calling-transcriptions
    baseUri: https://voice.messagebird.com
    description: MessageBird Voice Calling API — Transcriptions business capability. Self-contained, no shared references.
    resources:
    - name: recordings-recordingId-transcriptions
      path: /recordings/{recordingId}/transcriptions
      operations:
      - name: listtranscriptions
        method: GET
        description: List transcriptions for a recording
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtranscription
        method: POST
        description: Create a transcription
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MESSAGEBIRD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: voice-calling-transcriptions-rest
    port: 8080
    description: REST adapter for MessageBird Voice Calling API — Transcriptions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/recordings/{recordingid}/transcriptions
      name: recordings-recordingid-transcriptions
      description: REST surface for recordings-recordingId-transcriptions.
      operations:
      - method: GET
        name: listtranscriptions
        description: List transcriptions for a recording
        call: voice-calling-transcriptions.listtranscriptions
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtranscription
        description: Create a transcription
        call: voice-calling-transcriptions.createtranscription
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: voice-calling-transcriptions-mcp
    port: 9090
    transport: http
    description: MCP adapter for MessageBird Voice Calling API — Transcriptions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-transcriptions-recording
      description: List transcriptions for a recording
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: voice-calling-transcriptions.listtranscriptions
      outputParameters:
      - type: object
        mapping: $.
    - name: create-transcription
      description: Create a transcription
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: voice-calling-transcriptions.createtranscription
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
