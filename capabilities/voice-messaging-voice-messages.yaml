naftiko: 1.0.0-alpha2
info:
  label: MessageBird Voice Messaging API — Voice Messages
  description: 'MessageBird Voice Messaging API — Voice Messages. 4 operations. Lead operation: List voice messages. Self-contained
    Naftiko capability covering one Messagebird business surface.'
  tags:
  - Messagebird
  - Voice Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MESSAGEBIRD_API_KEY: MESSAGEBIRD_API_KEY
capability:
  consumes:
  - type: http
    namespace: voice-messaging-voice-messages
    baseUri: https://rest.messagebird.com
    description: MessageBird Voice Messaging API — Voice Messages business capability. Self-contained, no shared references.
    resources:
    - name: voicemessages
      path: /voicemessages
      operations:
      - name: listvoicemessages
        method: GET
        description: List voice messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createvoicemessage
        method: POST
        description: Send a voice message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: voicemessages-id
      path: /voicemessages/{id}
      operations:
      - name: viewvoicemessage
        method: GET
        description: View a voice message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletevoicemessage
        method: DELETE
        description: Delete a voice message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MESSAGEBIRD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: voice-messaging-voice-messages-rest
    port: 8080
    description: REST adapter for MessageBird Voice Messaging API — Voice Messages. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/voicemessages
      name: voicemessages
      description: REST surface for voicemessages.
      operations:
      - method: GET
        name: listvoicemessages
        description: List voice messages
        call: voice-messaging-voice-messages.listvoicemessages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createvoicemessage
        description: Send a voice message
        call: voice-messaging-voice-messages.createvoicemessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/voicemessages/{id}
      name: voicemessages-id
      description: REST surface for voicemessages-id.
      operations:
      - method: GET
        name: viewvoicemessage
        description: View a voice message
        call: voice-messaging-voice-messages.viewvoicemessage
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletevoicemessage
        description: Delete a voice message
        call: voice-messaging-voice-messages.deletevoicemessage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: voice-messaging-voice-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for MessageBird Voice Messaging API — Voice Messages. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-voice-messages
      description: List voice messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: voice-messaging-voice-messages.listvoicemessages
      outputParameters:
      - type: object
        mapping: $.
    - name: send-voice-message
      description: Send a voice message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: voice-messaging-voice-messages.createvoicemessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: view-voice-message
      description: View a voice message
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: voice-messaging-voice-messages.viewvoicemessage
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-voice-message
      description: Delete a voice message
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: voice-messaging-voice-messages.deletevoicemessage
      outputParameters:
      - type: object
        mapping: $.
