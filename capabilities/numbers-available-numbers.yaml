naftiko: 1.0.0-alpha2
info:
  label: MessageBird Numbers API — Available Numbers
  description: 'MessageBird Numbers API — Available Numbers. 1 operations. Lead operation: Search available phone numbers.
    Self-contained Naftiko capability covering one Messagebird business surface.'
  tags:
  - Messagebird
  - Available Numbers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MESSAGEBIRD_API_KEY: MESSAGEBIRD_API_KEY
capability:
  consumes:
  - type: http
    namespace: numbers-available-numbers
    baseUri: https://numbers.messagebird.com/v1
    description: MessageBird Numbers API — Available Numbers business capability. Self-contained, no shared references.
    resources:
    - name: available-phone-numbers-countryCode
      path: /available-phone-numbers/{countryCode}
      operations:
      - name: listavailablenumbers
        method: GET
        description: Search available phone numbers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: countryCode
          in: path
          type: string
          description: The two-letter ISO 3166-1 country code to search in.
          required: true
        - name: features
          in: query
          type: array
          description: Filter by number features.
        - name: type
          in: query
          type: string
          description: Filter by number type.
        - name: searchPattern
          in: query
          type: string
          description: A pattern to search for in available numbers.
        - name: limit
          in: query
          type: integer
          description: The maximum number of results to return.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.MESSAGEBIRD_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: numbers-available-numbers-rest
    port: 8080
    description: REST adapter for MessageBird Numbers API — Available Numbers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/available-phone-numbers/{countrycode}
      name: available-phone-numbers-countrycode
      description: REST surface for available-phone-numbers-countryCode.
      operations:
      - method: GET
        name: listavailablenumbers
        description: Search available phone numbers
        call: numbers-available-numbers.listavailablenumbers
        with:
          countryCode: rest.countryCode
          features: rest.features
          type: rest.type
          searchPattern: rest.searchPattern
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: numbers-available-numbers-mcp
    port: 9090
    transport: http
    description: MCP adapter for MessageBird Numbers API — Available Numbers. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: search-available-phone-numbers
      description: Search available phone numbers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: numbers-available-numbers.listavailablenumbers
      with:
        countryCode: tools.countryCode
        features: tools.features
        type: tools.type
        searchPattern: tools.searchPattern
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
