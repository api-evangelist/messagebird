  - type: Features
    data:
      - 'Email: Free 1K/mo, Startup from $15/mo (50K-100K), Growth from $80/mo (100K-2.5M), $0.90 per 1,000 overage'
      - 'SMS: per-destination rates across 200+ countries (e.g. AU/BR $0.0325, AT $0.055)'
      - 'WhatsApp: $0.030 marketing, $0.0084 utility/authentication/service, plus the Meta share'
      - 'Voice: $0.0049/min outbound US landline + $0.0040/min call handling fee; US local number $1.00/mo'
      - 'Lookup: $0.0050 base + per-property; email lookup $0.00050 per verdict'
      - REST API at platform.bird.com (regional us1./eu1.)
      - Rate limits per ORGANIZATION per policy; quota advertised at runtime in RateLimit-Policy (RFC 9651)
      - OAuth 2.0 (44 scopes, PKCE S256, device code, RFC 7591 registration) + bk_{region}_ API keys
      - Opt-in Idempotency-Key on POST/PATCH/PUT/DELETE, 3-hour replay window
      - 'Standard Webhooks delivery: 8 attempts over ~27.5h, HMAC-SHA256, whsec_ secrets'
      - Hosted MCP server at mcp.bird.com (credential-less OAuth) plus local stdio via the bird CLI
      - 'bird CLI: JSON by default, six semantic exit codes, --dry-run / --example / --idempotency-key'
      - Published agent skills (bird-ai Agent Plugins marketplace plugin)
      - RFC 9727 api-catalog, RFC 9116 security.txt, ard.json, llms.txt, Markdown twin of every docs page
      - 'Mail sandbox: magic @messagebird.dev addresses simulate delivery, bounce, deferral, complaint and suppression'
      - 200+ countries supported
