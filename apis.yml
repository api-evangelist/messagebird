name: Messagebird
aid: messagebird
description: 'MessageBird, which trades as Bird, is a Dutch cloud communications company whose platform carries
  email, SMS, WhatsApp, RCS, push, voice and eSIM traffic for businesses in over 200 countries. Bird publishes a
  first-party OpenAPI 3.1 description of 277 operations at bird.com/openapi.json and generates its TypeScript, Python,
  Go and PHP SDKs from it. The platform is unusually agent-native: a hosted MCP server at mcp.bird.com behind credential-less
  OAuth, a bird CLI with JSON output and semantic exit codes, published agent skills shipped as an Agent Plugins
  marketplace plugin, an RFC 9727 api-catalog, an Agentic Resource Discovery document, an llms.txt, and a Markdown
  twin of every documentation page. One auth model, one opt-in Idempotency-Key contract, IETF RateLimit headers
  and one stable error envelope span every channel. The legacy MessageBird REST API at rest.messagebird.com is still
  served alongside it.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/messagebird.png
url: https://raw.githubusercontent.com/api-evangelist/messagebird/refs/heads/main/apis.yml
