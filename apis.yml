apis:
  - aid: messagebird:bird-api
    name: Bird API
    description: 'The current Bird platform API: one REST API for email, SMS, WhatsApp, verification, lookup and
      Realtime, plus workspaces, organizations, teams, sending domains, dedicated IPs, suppressions, contacts and
      audiences. 277 operations over 216 paths, described by a first-party OpenAPI 3.1 document Bird publishes at
      https://bird.com/openapi.json and generates its SDKs from. Bearer API keys prefixed bk_{region}_ or OAuth
      2.0 access tokens from platform.bird.com; opt-in Idempotency-Key on every mutating request; IETF RateLimit
      response headers; a stable, documented error-code catalog; and Standard Webhooks event delivery.'
    humanURL: https://bird.com/docs/api
    baseURL: https://platform.bird.com
    tags:
