deprecation:
  policy_url: null
  sunset_header: false
  note: >-
    No published deprecation policy and no RFC 8594 Sunset/Deprecation header support found.
    No operation in the Bird OpenAPI carries `deprecated: true` (0 of 277). What Bird does
    publish instead is a set of non-rename guarantees on error codes and event names, plus a
    410 Gone response on 15 operations for resources that existed and are no longer available.
    The legacy MessageBird REST API (rest.messagebird.com, developers.messagebird.com) is
    still served and is not marked deprecated anywhere, although the SDK generation that
    wraps it has not shipped since 2022-2025 while the Bird generation ships weekly.
